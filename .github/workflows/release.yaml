name: Release PDF

on:
  push:
    tags:
      - "v*" # triggers on v0.1, v1.0, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Compile PDF
        run: |
          typst compile thesis.typ thesis.pdf \
            --input git-tag=${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: thesis.pdf
          name: ${{ github.ref_name }}
          body: |
            Compiled PDF for tag `${{ github.ref_name }}`
          draft: false
          prerelease: ${{ contains(github.ref_name, 'draft') }}
